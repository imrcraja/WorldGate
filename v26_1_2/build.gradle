plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

sourceSets {
    main {
        java {
            // Pulls in the version-agnostic Firebase/network/mod-init
            // classes from ../common instead of duplicating them.
            srcDir '../common/src/main/java'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    loader "net.fabricmc:fabric-loader:${project.loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Used by PlayerTabOverlayMixin for the colored ping display
    implementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    include "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
