name: WorldGate Continuous Security Watchdog

on:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [ main, worldgate-ecosystem-polish ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Relay dependency install
        working-directory: relay
        run: npm ci

      - name: Relay syntax check
        run: node --check relay/server.js

      - name: Relay dependency audit
        working-directory: relay
        run: npm audit --omit=dev --audit-level=high

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build 26.1.2
        run: gradle :v26_1_2:build --stacktrace --no-daemon

      - name: Upload 26.1.2 jar
        uses: actions/upload-artifact@v4
        with:
          name: WorldGate-26.1.2
          path: v26_1_2/build/libs/*.jar

      - name: Secret-pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='package-lock.json' '(-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' .; then
            echo "Potential hard-coded credential pattern found."
            exit 1
          fi
