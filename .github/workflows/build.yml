name: Build WorldGate

on:
  push:
    branches: [ main, worldgate-essential-style-ui ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build all versions
        run: gradle build --stacktrace --no-daemon

      - name: Verify built JAR
        run: |
          test -n "$(find v26_1_2/build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          find v26_1_2/build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload 26.1.2 jar
        uses: actions/upload-artifact@v4
        with:
          name: WorldGate-26.1.2
          path: v26_1_2/build/libs/*.jar
          if-no-files-found: error
