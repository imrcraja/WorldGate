name: Build WorldGate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 26.1.x requires Java 25.
      # Gradle 9.1+ is required to run Gradle on Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build all versions
        run: gradle build --stacktrace --no-daemon

      - name: Upload 1.21.1 jar
        uses: actions/upload-artifact@v4
        with:
          name: WorldGate-1.21.1
          path: v1_21_1/build/libs/*.jar

      - name: Upload 26.1.2 jar
        uses: actions/upload-artifact@v4
        with:
          name: WorldGate-26.1.2
          path: v26_1_2/build/libs/*.jar
