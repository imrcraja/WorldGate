plugins { id 'net.fabricmc.fabric-loom-remap' version "1.17.21" }
version = rootProject.mod_version
group = rootProject.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = 'https://maven.fabricmc.net/' } }
sourceSets { main { java { srcDirs = ['../common/src/main/java', '../v1_20_1/src/main/java'] } resources { srcDirs = ['../v1_20_1/src/main/resources'] } } }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
 implementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
 annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
 include "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}
processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }