plugins { id 'net.fabricmc.fabric-loom' version "1.17.21" }
version = rootProject.mod_version
group = rootProject.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = 'https://maven.fabricmc.net/' } }
sourceSets { main { java { srcDirs = ['../common/src/main/java', '../v26_1_2/src/main/java'] } resources { srcDirs = ['../v26_1_2/src/main/resources'] } } }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${project.loader_version}"
 api "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
 implementation "io.github.llamalad7:mixinextras-fabric:0.4.1"
 annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.4.1"
 include "io.github.llamalad7:mixinextras-fabric:0.4.1"
}
processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }